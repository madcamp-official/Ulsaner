rules:
  - id: missing-ownership-check
    languages: [python]
    severity: WARNING
    message: >
      Route handler fetches a resource by ID and returns it without any
      per-object authorization check (IDOR risk).
    patterns:
      - pattern: |
          def $FUNC(...):
              ...
              $OBJ = $GET_FN(...)
              ...
              return ...
      - pattern-not: |
          def $FUNC(...):
              ...
              $OBJ = $GET_FN(...)
              ...
              if $OBJ.$FIELD != $USER.$FIELD2:
                  ...
              ...
              return ...
