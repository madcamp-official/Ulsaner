<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ulsaner — 취약점 훈련 엔진</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: oklch(0.155 0.006 255); }
  a { color: oklch(0.8 0.13 155); text-decoration: none; }
  ::selection { background: oklch(0.8 0.13 155 / 0.28); }
  @keyframes ul-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes ul-spin { to { transform: rotate(360deg); } }
  @keyframes ul-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
  @keyframes ul-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  input::placeholder { color: oklch(0.5 0.006 255); }
  .start-btn:not(:disabled):hover { background: oklch(0.8 0.13 155 / 0.24) !important; }
  .submit-btn:not(:disabled):hover { background: oklch(0.8 0.13 155 / 0.26) !important; }
  .copy-btn:hover { color: oklch(0.9 0.005 255) !important; border-color: oklch(0.4 0.008 255) !important; }
  .exit-btn:hover { border-color: oklch(0.5 0.1 25) !important; color: oklch(0.72 0.15 25) !important; }
  .back-btn:hover { color: oklch(0.86 0.005 255) !important; }
  .flag-in:focus { border-color: oklch(0.8 0.13 155) !important; }
</style>
</head>
<body>
<div id="app" style="min-height: 100vh; background: oklch(0.155 0.006 255); color: oklch(0.93 0.005 255); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 0 24px 80px;"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 배포 준비 안 된 챌린지(디자인의 "준비 중" 카드) — 백엔드 화이트리스트엔 없음.
const UPCOMING = [
  { id: "easy-sqli-01", type: "SQLi", tier: "easy", summary: "문자열 이어붙이기로 만든 질의. (슬롯 준비 중)" },
  { id: "hard-idor-01", type: "IDOR", tier: "hard", summary: "체크는 있으나 틀린 소유권 필드를 비교하는 로직 결함. 정적분석에 안 잡힌다. (준비 중)" },
];

const state = {
  solved: 0, attempts: 0,
  phase: "catalog",          // catalog | spinup | running | solved
  challenges: [],            // 카탈로그(실제 + 준비중)
  instance: null,            // { challenge, port, id(challenge_id), url, task }
  flagInput: "", result: null, copyLabel: "복사", spinLog: [], ttl: 0,
};
let ttlTimer = null;

// --- 색/스타일 (디자인 그대로) ---
const typeColors = {
  IDOR: { fg: "oklch(0.82 0.12 230)", bd: "oklch(0.45 0.08 230)" },
  SQLi: { fg: "oklch(0.83 0.12 300)", bd: "oklch(0.45 0.08 300)" },
};
const tierColors = {
  easy: { fg: "oklch(0.8 0.13 155)", bd: "oklch(0.42 0.09 155)" },
  hard: { fg: "oklch(0.8 0.13 65)", bd: "oklch(0.45 0.1 65)" },
};
const badge = (c) => `display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:${c.fg};border:1px solid ${c.bd};border-radius:5px;padding:2px 8px;`;
const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null; try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}

// --- 데이터 로드 ---
async function loadCatalog() {
  const { data } = await api("/challenges");
  const real = ((data && data.available) || []).map((c) => ({
    id: c.name,
    type: (c.vuln_type || "").toUpperCase(),
    tier: c.tier,
    summary: c.task_prompt,
    meta: ["동적 포트", "Docker 격리", "flag 검증"],
    locked: false,
  }));
  const upcoming = UPCOMING.map((c) => ({ ...c, meta: ["준비 중"], locked: true }));
  state.challenges = [...real, ...upcoming];
  render();
}
async function loadStats() {
  const { data } = await api("/stats");
  if (data) { state.solved = data.solved; state.attempts = data.attempts; render(); }
}

// --- 액션 (실제 백엔드) ---
async function start(id) {
  const ch = state.challenges.find((c) => c.id === id);
  if (!ch || ch.locked) return;
  clearInterval(ttlTimer);
  state.phase = "spinup"; state.instance = { challenge: ch }; state.spinLog = [];
  state.flagInput = ""; state.result = null; state.copyLabel = "복사"; render();

  const steps = [
    "$ orchestrator spinup " + ch.id,
    "→ 번들 빌드 (docker build)… ok",
    "→ 컨테이너 실행 (non-root)… ok",
    "→ 동적 포트 할당",
    "→ 헬스체크… healthy",
  ];
  const started = Date.now();
  steps.forEach((line, i) => setTimeout(() => {
    if (state.phase !== "spinup") return;
    state.spinLog.push(line); render();
  }, 260 + i * 300));

  // 실제 스핀업
  const { ok, data } = await api("/challenges", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: ch.id }),
  });
  const finish = () => {
    if (!ok || !data) {
      state.phase = "catalog"; state.instance = null;
      alert("인스턴스 배포에 실패했습니다. Docker 데몬을 확인하세요.");
      render(); return;
    }
    const port = (data.url.match(/:(\d+)/) || [])[1] || "";
    state.instance = {
      challenge: ch, id: data.challenge_id, url: data.url, port,
      task: (data.entry && data.entry.task_prompt) || ch.summary,
    };
    state.phase = "running"; state.ttl = 30 * 60; render();
    clearInterval(ttlTimer);
    ttlTimer = setInterval(() => {
      if (state.ttl <= 1) { clearInterval(ttlTimer); exit(true); return; }
      state.ttl -= 1;
      const t = $("ttl"); if (t) { t.textContent = fmt(state.ttl); if (state.ttl < 60) t.style.color = "oklch(0.72 0.15 25)"; }
    }, 1000);
  };
  const wait = Math.max(0, 260 + steps.length * 300 + 200 - (Date.now() - started));
  setTimeout(finish, wait);
}

async function submit() {
  const inst = state.instance;
  if (state.phase !== "running" || !inst || !state.flagInput.trim()) return;
  const { ok, status, data } = await api(`/challenges/${inst.id}/submit`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ flag: state.flagInput.trim() }),
  });
  if (status === 404) { state.result = "expired"; render(); await loadStats(); return; }
  if (ok && data && data.correct) {
    clearInterval(ttlTimer);
    state.result = "correct"; state.phase = "solved";
  } else {
    state.result = "wrong";
  }
  render(); await loadStats();
}

async function exit(silent) {
  const inst = state.instance;
  clearInterval(ttlTimer);
  if (inst && inst.id) { api(`/challenges/${inst.id}`, { method: "DELETE" }).catch(() => {}); }
  state.phase = "catalog"; state.instance = null; state.flagInput = ""; state.result = null;
  render(); if (!silent) loadStats();
}

function copy() {
  const url = state.instance && state.instance.url;
  if (url && navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
  state.copyLabel = "복사됨"; render();
  setTimeout(() => { state.copyLabel = "복사"; render(); }, 1400);
}

// --- 렌더 ---
function topbar() {
  return `<header style="width:100%;max-width:1080px;display:flex;align-items:center;justify-content:space-between;padding:22px 0 20px;border-bottom:1px solid oklch(0.27 0.008 255);">
    <div style="display:flex;align-items:baseline;gap:14px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="width:11px;height:11px;border-radius:2px;background:oklch(0.8 0.13 155);box-shadow:0 0 12px oklch(0.8 0.13 155 / 0.6);"></div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;letter-spacing:-0.01em;">ulsaner</span>
      </div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:oklch(0.58 0.006 255);">취약점 주입 훈련 엔진</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="/dashboard" style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:oklch(0.7 0.006 255);border:1px solid oklch(0.27 0.008 255);border-radius:10px;padding:9px 14px;text-decoration:none;">대시보드</a>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:8px 16px;border:1px solid oklch(0.27 0.008 255);border-radius:10px;background:oklch(0.185 0.006 255);">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:oklch(0.58 0.006 255);letter-spacing:0.02em;">풀이</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1;color:oklch(0.8 0.13 155);">${state.solved}</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:8px 16px;border:1px solid oklch(0.27 0.008 255);border-radius:10px;background:oklch(0.185 0.006 255);">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:oklch(0.58 0.006 255);letter-spacing:0.02em;">시도</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1;color:oklch(0.93 0.005 255);">${state.attempts}</span>
      </div>
    </div>
  </header>`;
}

function catalogView() {
  const available = state.challenges.filter((c) => !c.locked).length;
  const cards = state.challenges.map((c) => {
    const tC = typeColors[c.type] || typeColors.IDOR;
    const kC = tierColors[c.tier] || tierColors.easy;
    const titleColor = c.locked ? "oklch(0.55 0.006 255)" : "oklch(0.93 0.005 255)";
    const summaryColor = c.locked ? "oklch(0.48 0.006 255)" : "oklch(0.66 0.006 255)";
    const cardStyle = `border:1px solid oklch(0.27 0.008 255);border-radius:14px;padding:20px 20px;background:oklch(0.185 0.006 255);${c.locked ? "opacity:0.55;" : ""}`;
    const btnStyle = c.locked
      ? "width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:11px;border-radius:9px;border:1px solid oklch(0.27 0.008 255);background:transparent;color:oklch(0.45 0.006 255);cursor:not-allowed;"
      : "width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:11px;border-radius:9px;border:1px solid oklch(0.42 0.09 155);background:oklch(0.8 0.13 155 / 0.14);color:oklch(0.85 0.13 155);cursor:pointer;transition:background 0.15s;";
    const chips = c.meta.map((m) => `<span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:oklch(0.6 0.006 255);border:1px solid oklch(0.27 0.008 255);border-radius:999px;padding:3px 9px;">${esc(m)}</span>`).join("");
    return `<article style="${cardStyle}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <span style="${badge(tC)}">${esc(c.type)}</span>
        <span style="${badge(kC)}">${esc(c.tier)}</span>
        ${c.locked ? '<span style="margin-left:auto;font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:oklch(0.55 0.006 255);">준비 중</span>' : ""}
      </div>
      <h2 style="margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:${titleColor};">${esc(c.id)}</h2>
      <p style="margin:0 0 18px;font-size:13.5px;line-height:1.5;color:${summaryColor};min-height:40px;">${esc(c.summary)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;">${chips}</div>
      <button class="start-btn" data-act="start" data-id="${esc(c.id)}" ${c.locked ? "disabled" : ""} style="${btnStyle}">${c.locked ? "준비 중" : "시작하기"}</button>
    </article>`;
  }).join("");

  return `<section>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;">
      <h1 style="margin:0;font-size:26px;font-weight:700;letter-spacing:-0.02em;">챌린지</h1>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:oklch(0.58 0.006 255);">사용 가능 ${available} · 전체 ${state.challenges.length}</span>
    </div>
    <p style="margin:0 0 26px;font-size:14px;color:oklch(0.62 0.006 255);max-width:620px;line-height:1.55;">인스턴스마다 새로 생성되는 취약 앱. 정답을 찾아볼 수 없으니 직접 공략해 flag를 획득하라.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;">${cards}</div>
  </section>`;
}

function sessionView() {
  const inst = state.instance;
  const ch = inst && inst.challenge;
  const phase = state.phase;
  const statusMap = {
    spinup: { label: "스핀업 중", fg: "oklch(0.8 0.13 65)", anim: "animation:ul-pulse 1.1s ease-in-out infinite;" },
    running: { label: "실행 중", fg: "oklch(0.8 0.13 155)", anim: "" },
    solved: { label: "해결됨 · 종료", fg: "oklch(0.62 0.006 255)", anim: "" },
  };
  const st = statusMap[phase] || statusMap.running;
  const bd = st.fg.replace("0.8", "0.4").replace("0.62", "0.35");
  const ttlLow = state.ttl > 0 && state.ttl < 60;
  const ttlColor = ttlLow ? "oklch(0.72 0.15 25)" : "oklch(0.86 0.005 255)";
  const ttlBorder = ttlLow ? "oklch(0.5 0.12 25)" : "oklch(0.27 0.008 255)";

  const header = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <h1 style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;letter-spacing:-0.01em;">${esc(ch ? ch.id : "")}</h1>
      <span style="display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:${st.fg};border:1px solid ${bd};border-radius:999px;padding:4px 11px;"><span style="width:7px;height:7px;border-radius:50%;background:${st.fg};${st.anim}"></span>${st.label}</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid ${ttlBorder};border-radius:10px;background:oklch(0.185 0.006 255);">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:oklch(0.58 0.006 255);">남은 시간</span>
      <span id="ttl" style="font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:${ttlColor};letter-spacing:0.02em;">${fmt(state.ttl)}</span>
    </div>
  </div>`;

  let body;
  if (phase === "spinup") {
    const lines = state.spinLog.map((l) => `<div>${esc(l)}</div>`).join("");
    body = `<div style="border:1px solid oklch(0.27 0.008 255);border-radius:14px;background:oklch(0.175 0.006 255);padding:28px 26px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:16px;height:16px;border:2px solid oklch(0.3 0.008 255);border-top-color:oklch(0.8 0.13 155);border-radius:50%;animation:ul-spin 0.8s linear infinite;"></div>
        <span style="font-size:14px;color:oklch(0.86 0.005 255);">격리 인스턴스 배포 중…</span>
      </div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.9;color:oklch(0.66 0.006 255);background:oklch(0.145 0.006 255);border-radius:8px;padding:14px 16px;">
        ${lines}<div style="color:oklch(0.8 0.13 155);">▍<span style="animation:ul-blink 1s step-end infinite;">_</span></div>
      </div>
    </div>`;
  } else {
    const isSolved = phase === "solved";
    const submitDisabled = isSolved || !state.flagInput.trim();
    const submitBtnStyle = submitDisabled
      ? "font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:0 22px;border-radius:9px;border:1px solid oklch(0.27 0.008 255);background:oklch(0.22 0.006 255);color:oklch(0.5 0.006 255);cursor:not-allowed;"
      : "font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:0 22px;border-radius:9px;border:1px solid oklch(0.42 0.09 155);background:oklch(0.8 0.13 155 / 0.16);color:oklch(0.85 0.13 155);cursor:pointer;";
    const submitBorder = state.result === "correct" ? "oklch(0.42 0.09 155)" : (state.result === "wrong" || state.result === "expired" ? "oklch(0.45 0.1 25)" : "oklch(0.27 0.008 255)");
    let resultHtml = "";
    if (state.result) {
      const okc = state.result === "correct";
      const rStyle = okc
        ? "margin-top:14px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;padding:13px 15px;border-radius:9px;background:oklch(0.8 0.13 155 / 0.12);border:1px solid oklch(0.45 0.1 155);color:oklch(0.86 0.13 155);animation:ul-rise 0.25s ease both;"
        : "margin-top:14px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;padding:13px 15px;border-radius:9px;background:oklch(0.65 0.16 25 / 0.1);border:1px solid oklch(0.5 0.13 25);color:oklch(0.75 0.15 25);animation:ul-rise 0.25s ease both;";
      const title = okc ? "정답" : (state.result === "expired" ? "만료" : "오답");
      const msg = okc ? "인스턴스를 종료했습니다. 풀이 수가 반영되었습니다."
        : (state.result === "expired" ? "인스턴스가 종료되었습니다. 목록에서 다시 시작하세요." : "flag가 일치하지 않습니다. 다시 공략해 보세요.");
      resultHtml = `<div style="${rStyle}"><span style="font-family:'IBM Plex Mono',monospace;font-weight:600;">${title}</span><span style="opacity:0.85;">${msg}</span></div>`;
    }
    body = `<div style="display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;">
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div style="border:1px solid oklch(0.27 0.008 255);border-radius:14px;background:oklch(0.175 0.006 255);padding:22px 24px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:oklch(0.58 0.006 255);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px;">과제</div>
          <p style="margin:0;font-size:15.5px;line-height:1.6;color:oklch(0.92 0.005 255);">${esc(inst ? inst.task : "")}</p>
        </div>
        <div style="border:1px solid ${submitBorder};border-radius:14px;background:oklch(0.175 0.006 255);padding:22px 24px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:oklch(0.58 0.006 255);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:12px;">flag 제출</div>
          <div style="display:flex;gap:10px;">
            <input id="flagInput" class="flag-in" value="${esc(state.flagInput)}" ${isSolved ? "disabled" : ""} placeholder="FLAG{...}" spellcheck="false" autocomplete="off" style="flex:1;min-width:0;font-family:'IBM Plex Mono',monospace;font-size:14px;background:oklch(0.145 0.006 255);border:1px solid oklch(0.3 0.008 255);border-radius:9px;padding:12px 14px;color:oklch(0.93 0.005 255);outline:none;" />
            <button class="submit-btn" data-act="submit" ${submitDisabled ? "disabled" : ""} style="${submitBtnStyle}">제출</button>
          </div>
          ${resultHtml}
        </div>
      </div>
      <aside style="border:1px solid oklch(0.27 0.008 255);border-radius:14px;background:oklch(0.175 0.006 255);padding:20px 20px;display:flex;flex-direction:column;gap:16px;">
        <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:oklch(0.58 0.006 255);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px;">접속 URL</div>
          <div style="display:flex;align-items:center;gap:8px;background:oklch(0.145 0.006 255);border:1px solid oklch(0.3 0.008 255);border-radius:9px;padding:10px 12px;">
            <a href="${esc(inst ? inst.url : "#")}" target="_blank" rel="noopener" style="flex:1;min-width:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:oklch(0.8 0.13 155);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(inst ? inst.url : "")}</a>
            <button class="copy-btn" data-act="copy" style="flex-shrink:0;background:oklch(0.22 0.006 255);border:1px solid oklch(0.3 0.008 255);border-radius:6px;color:oklch(0.7 0.006 255);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 9px;cursor:pointer;">${state.copyLabel}</button>
          </div>
          <p style="margin:8px 0 0;font-size:11.5px;line-height:1.5;color:oklch(0.55 0.006 255);">Docker 격리 · 동적 포트 할당 · non-root</p>
        </div>
        <div style="height:1px;background:oklch(0.27 0.008 255);"></div>
        <dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;">
          <dt style="color:oklch(0.55 0.006 255);">인스턴스</dt><dd style="margin:0;color:oklch(0.86 0.005 255);">${esc(inst ? inst.id.slice(0, 8) : "")}</dd>
          <dt style="color:oklch(0.55 0.006 255);">포트</dt><dd style="margin:0;color:oklch(0.86 0.005 255);">${esc(inst ? inst.port : "")}</dd>
          <dt style="color:oklch(0.55 0.006 255);">검증</dt><dd style="margin:0;color:oklch(0.86 0.005 255);">flag_submit</dd>
        </dl>
        <button class="exit-btn" data-act="exit" style="margin-top:2px;background:none;border:1px solid oklch(0.3 0.008 255);border-radius:9px;color:oklch(0.68 0.02 25);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px;cursor:pointer;">인스턴스 종료</button>
      </aside>
    </div>`;
  }

  return `<section style="animation:ul-rise 0.35s ease both;">
    <button class="back-btn" data-act="exit" style="display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:oklch(0.62 0.006 255);font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;padding:0;margin-bottom:20px;">← 챌린지 목록</button>
    ${header}${body}
  </section>`;
}

function render() {
  const main = state.phase === "catalog" ? catalogView() : sessionView();
  $("app").innerHTML = topbar() + `<main style="width:100%;max-width:1080px;padding-top:34px;">${main}</main>`;

  const fi = $("flagInput");
  if (fi) {
    fi.addEventListener("input", (e) => { state.flagInput = e.target.value; if (state.result === "wrong") { state.result = null; } render(); const n = $("flagInput"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
    fi.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }
  document.querySelectorAll("[data-act]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const act = btn.getAttribute("data-act");
      if (act === "start") start(btn.getAttribute("data-id"));
      else if (act === "submit") submit();
      else if (act === "exit") exit();
      else if (act === "copy") copy();
    });
  });
}

render();
loadCatalog();
loadStats();
</script>
</body>
</html>
